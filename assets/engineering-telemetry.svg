<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Signal — Public GitHub Activity</title>
  <desc id="desc">A custom engineering telemetry panel showing public GitHub activity over the last year.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D18"/>
      <stop offset="0.52" stop-color="#0C1324"/>
      <stop offset="1" stop-color="#11182B"/>
    </linearGradient>
    <linearGradient id="headerAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="signalBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="signalGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="microGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#314160" stroke-width="0.5" opacity="0.16"/>
    </pattern>
    <style>
      text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .eyebrow {
        fill: #7DD3FC;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2.2px;
      }
      .name {
        fill: #F8FAFC;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      .metric-label {
        fill: #7182A6;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .metric-value {
        fill: #EAF1FF;
        font-size: 22px;
        font-weight: 700;
      }
      .chart-label {
        fill: #8293B7;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.4px;
      }
      .microcopy {
        fill: #607091;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.7px;
      }
      .reveal,
      .metric-card,
      .signal-bar,
      .peak-dot {
        opacity: 0;
      }
      .header-reveal {
        animation: fadeInAnimation 0.55s ease-out 0.05s forwards;
      }
      .status-reveal {
        animation: fadeInAnimation 0.45s ease-out 0.2s forwards;
      }
      .metric-card {
        animation: fadeInAnimation 0.42s ease-out forwards;
      }
      .metric-1 { animation-delay: 0.3s; }
      .metric-2 { animation-delay: 0.42s; }
      .metric-3 { animation-delay: 0.54s; }
      .metric-4 { animation-delay: 0.66s; }
      .chart-reveal {
        animation: fadeInAnimation 0.5s ease-out 0.75s forwards;
      }
      .signal-bar {
        animation: revealBarAnimation 0.22s ease-out forwards;
      }
      .signal-line {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: drawSignalAnimation 1.25s ease-out 0.95s forwards;
      }
      .peak-dot {
        animation: fadeInAnimation 0.3s ease-out 1.85s forwards;
      }
      @keyframes fadeInAnimation {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes revealBarAnimation {
        from { opacity: 0; }
        to { opacity: var(--target-opacity); }
      }
      @keyframes drawSignalAnimation {
        from { stroke-dashoffset: 1200; }
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal,
        .metric-card,
        .signal-bar,
        .peak-dot {
          animation: none;
          opacity: 1;
        }
        .signal-bar {
          opacity: var(--target-opacity);
        }
        .signal-line {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="958.5" height="348.5" rx="18" fill="url(#background)" stroke="#283755" stroke-width="1.5"/>
  <rect x="1" y="1" width="958" height="348" rx="18" fill="url(#microGrid)" opacity="0.55"/>
  <path d="M0 18Q0 0 18 0H942Q960 0 960 18V22H0Z" fill="url(#headerAccent)" opacity="0.9"/>

  <g transform="translate(42 41)" class="reveal header-reveal">
    <circle cx="5" cy="5" r="5" fill="#22D3EE" opacity="0.22"/>
    <circle cx="5" cy="5" r="2.4" fill="#67E8F9"/>
    <text x="20" y="9" class="eyebrow">SYSTEMS // AUTOMATION // INFRASTRUCTURE</text>
    <text x="0" y="41" class="name">ENGINEERING SIGNAL</text>
  </g>

  <g transform="translate(796 42)" class="reveal status-reveal">
    <rect width="122" height="30" rx="15" fill="#0C2630" stroke="#1B5B66"/>
    <circle cx="18" cy="15" r="4" fill="#34D399"/>
    <circle cx="18" cy="15" r="8" fill="#34D399" opacity="0.1"/>
    <text x="32" y="19" class="eyebrow" style="font-size:9px;letter-spacing:1.2px;fill:#6EE7B7">LIVE SIGNAL</text>
  </g>

  
    <g transform="translate(42 93)" class="metric-card metric-1">
      <rect width="205" height="69" rx="12" fill="#10182B" stroke="#243252"/>
      <rect x="0" y="13" width="3" height="43" rx="1.5" fill="#61DAFB"/>
      <text x="18" y="29" class="metric-label">CONTRIBUTIONS / 12M</text>
      <text x="18" y="55" class="metric-value">723</text>
    </g>
    <g transform="translate(261 93)" class="metric-card metric-2">
      <rect width="205" height="69" rx="12" fill="#10182B" stroke="#243252"/>
      <rect x="0" y="13" width="3" height="43" rx="1.5" fill="#8B5CF6"/>
      <text x="18" y="29" class="metric-label">PUBLIC REPOSITORIES</text>
      <text x="18" y="55" class="metric-value">26</text>
    </g>
    <g transform="translate(480 93)" class="metric-card metric-3">
      <rect width="205" height="69" rx="12" fill="#10182B" stroke="#243252"/>
      <rect x="0" y="13" width="3" height="43" rx="1.5" fill="#22D3EE"/>
      <text x="18" y="29" class="metric-label">ACTIVE WEEKS</text>
      <text x="18" y="55" class="metric-value">18 / 53</text>
    </g>
    <g transform="translate(699 93)" class="metric-card metric-4">
      <rect width="205" height="69" rx="12" fill="#10182B" stroke="#243252"/>
      <rect x="0" y="13" width="3" height="43" rx="1.5" fill="#A78BFA"/>
      <text x="18" y="29" class="metric-label">COMMIT SIGNAL</text>
      <text x="18" y="55" class="metric-value">55%</text>
    </g>

