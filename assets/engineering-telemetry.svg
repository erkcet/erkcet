      }
      .eyebrow {
        fill: #7DD3FC;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2.2px;
      }
      .name {
        fill: #F8FAFC;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      .metric-label {
        fill: #7182A6;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .metric-value {
        fill: #EAF1FF;
        font-size: 22px;
        font-weight: 700;
      }
      .chart-label {
        fill: #8293B7;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.4px;
      }
      .microcopy {
        fill: #607091;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.7px;
      }
    </style>
  </defs>

